[project]
name = "trustvar"
version = "0.1.0"
description = "A framework for measuring the robustness of LLM benchmarks under semantically-equivalent task reformulations"
authors = [{ name = "TrustVar Team" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "setuptools<81",
    "httpx>=0.28.1",
    "pyyaml>=0.6.3",
    "uvicorn>=0.34.0",
    "spacy>=3.8.3",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
api = [
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "motor==3.7.0",
    "pymongo==4.11.1",
    "celery[redis]==5.5.0",
    "redis==5.3.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "aiohttp==3.11.11",
    # The Results /trustvar-metrics endpoint imports eval_service (scipy / sklearn
    # / statsmodels), so the stats stack is a genuine API runtime dependency — not
    # only a celery/nlp concern. Fixed 2026-07-11: the api image shipped without
    # scipy, so every /trustvar-metrics call 500-ed → empty Results dashboards.
    "trustvar[stats]"
]
# Lightweight numeric/stats stack shared by the api (metrics endpoint) and the
# celery worker. No torch/transformers — keeps the api image slim.
stats = [
    "numpy==2.2.3",
    "scipy==1.15.1",
    "scikit-learn==1.6.1",
    "statsmodels>=0.14",
    "pandas>=2.0",
]
celery = [
    "trustvar[nlp]",
    "jinja2==3.1.5",
    "torch==2.5.1",
    "transformers==4.48.3",
    "sentence-transformers>=2.2,<5",
    # Pin datasets: sentence-transformers imports it at load time. Old datasets
    # uses pa.PyExtensionType, removed in pyarrow>=15 → AttributeError on import.
    # datasets>=2.16 switched to pa.ExtensionType. Pinned explicitly since uv
    # may resolve an older transitive version.
    "datasets>=2.16.0",
    # pyarrow: keep compatible with datasets>=2.16 (ExtensionType available
    # since pyarrow 4; PyExtensionType removed in 15). Upper bound avoids
    # future breaking changes pulling a version datasets can't use yet.
    "pyarrow>=12,<21",
    "bert-score==0.3.13",
    "huggingface-hub==0.27.1",
    "numpy==2.2.3",
    "scipy==1.15.1",
    "scikit-learn==1.6.1",
    "statsmodels>=0.14",
    "pandas>=2.0",
    "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@main",
    # flan-T5 tokenizer is SentencePiece-based; required by MiniCheck's tokenizer
    # load (google/flan-t5-large). Transitive + unpinned → an exact `uv sync
    # --extra celery` prunes it and EN scoring fails with a swallowed ImportError.
    # Declared here for reproducibility (same pattern as bert-score/datasets/pyarrow).
    # No numpy pin, so it does not reopen the numpy<2 conflict (§[tool.uv]).
    "sentencepiece>=0.1.99",
    "protobuf>=4",
    # MiniCheck loads the model with low_cpu_mem_usage=True / device_map, which
    # transformers routes through Accelerate. Transitive + unpinned → pruned by an
    # exact `uv sync --extra celery`, surfacing as an ImportError on EN model load.
    "accelerate>=0.26.0",
]

pymer4 = [
    "pymer4>=0.8",
    "rpy2>=3.5",
]




nlp = [
    "stanza==1.10.1",
    "spacy==3.8.3",
    "nltk==3.9.1",
    "lemminflect==0.2.3",
    "natasha==1.6.0",
    "pymorphy3==1.2.0",
    "ruwordnet>=0.0.6",
    # EN NER model: lazy spacy.load("en_core_web_sm") in Tier A
    # format_normalization.py (NER gate) and Tier C back_translation_single_pivot
    # (C8). Declared as a wheel URL so it is tracked by the lockfile and survives
    # exact `uv sync` (previously only present via manual `spacy download`).
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
test = [
    "trustvar[api]",
    "trustvar[nlp]",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]
sim = [
    "bambi>=0.17.2",
    "pymc>=5.28.5",
]

# Dev/test tooling. PEP 735 dependency-group (NOT an optional-dependency extra):
# the `dev` group is synced by default and is NOT removed when `uv sync` is run
# with `--extra ...`. This is why pytest/ruff vanished before — they lived in the
# `test` extra and an `--extra api/celery/nlp` sync (exact by default) dropped any
# package outside the requested extras. Runtime feature sets stay as extras
# (api/celery/nlp/...); only request the ones you need.
[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff>=0.6",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that mock external services (e.g. Ollama HTTP API)",
]
